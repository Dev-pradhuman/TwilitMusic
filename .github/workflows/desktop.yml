name: Desktop Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Linux Deb
      if: runner.os == 'Linux'
      run: ./gradlew :desktopApp:packageDeb

    - name: Build Windows MSI
      if: runner.os == 'Windows'
      run: ./gradlew :desktopApp:packageMsi

    - name: Build macOS DMG
      if: runner.os == 'macOS'
      run: ./gradlew :desktopApp:packageDmg

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-build-${{ runner.os }}
        path: |
          desktopApp/build/compose/binaries/main/deb/*.deb
          desktopApp/build/compose/binaries/main/msi/*.msi
          desktopApp/build/compose/binaries/main/dmg/*.dmg
